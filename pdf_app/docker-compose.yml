services:
  pdf_app:
    build: .
    container_name: pdf_app
    ports:
      - "8501:8501"
    environment:
      PDF_APP_DATA_DIR: /app/data
    volumes:
      - pdf_app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pdf_app_data:
